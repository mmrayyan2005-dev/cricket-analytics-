name: Update Cricket Data

# Runs automatically every day at 03:00 UTC, and can also be triggered
# manually from the GitHub Actions tab ("Run workflow" button) whenever you
# want fresh data immediately — no Colab required either way.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: cricket-analytics_-
          BRANCH: main
        run: python pipeline.py

      - name: Upload run log (for debugging failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-log
          path: pipeline_run.log
