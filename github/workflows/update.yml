name: Update Cricket Data

on:
  schedule:
    - cron: '0 3 * * *'   # Runs daily at 3 AM UTC
  workflow_dispatch:        # Also allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Run updater
        env:
          DATA_PUSH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}
          DATA_GITHUB_USER: ${{ secrets.DATA_GITHUB_USER }}
          DATA_GITHUB_REPO: ${{ secrets.DATA_GITHUB_REPO }}
        run: python update_cricket_data.py
