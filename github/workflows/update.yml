name: Update Cricket Data Daily

on:
  schedule:
    - cron: '0 2 * * *'   # Runs every day at 2:00 AM UTC
  workflow_dispatch:        # Also allows manual trigger from GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests scikit-learn numpy jupyter nbconvert

      - name: Run the notebook
        env:
          GITHUB_TOKEN_SECRET: ${{ secrets.CRICKET_GH_TOKEN }}
        run: |
          jupyter nbconvert --to notebook --execute All_Formats_Cricket_ML_v6.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            --output All_Formats_Cricket_ML_v6_executed.ipynb
